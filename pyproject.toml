[project]
name = "tensor_graphs"
version = "0.1.0"
description = "A graph-based tensor library for deep learning optimization and symbolic analysis."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aaron Belikoff", email = "aaronbelikoff@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "tqdm",
    "tokenizers",
    "huggingface-hub",
    "safetensors",
    "hf_xet",
    "transformers>=4.57.6",
    "rich>=15.0.0",
    "ruff>=0.16.1",
    "flask>=3.1.3",
    "pydantic>=2.13.4",
    "pybind11>=3.0.4",
    "psutil>=7.2.2",
    "matplotlib>=3.9.4",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
ortools = [
    "ortools>=9.15.6755",
]
ml = [
    "torch==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
]
embeddinggemma = [
    "av>=17.1.0 ; python_full_version >= '3.10'",
    "librosa>=0.11.0 ; python_full_version >= '3.10'",
    "sentence-transformers>=6.1.0 ; python_full_version >= '3.10'",
    "soundfile>=0.14.0 ; python_full_version >= '3.10'",
    "transformers>=5.18.0 ; python_full_version >= '3.10'",
]

[[tool.uv.index]]
name = "torch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.setuptools]
py-modules = ["embeddinggemma2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tensor_graphs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=tensor_graphs"

[tool.ruff.lint]
ignore = ["E402", "F403", "E741"]

[tool.uv.sources]
torch = { index = "torch-cu118" }
torchvision = { index = "torch-cu118" }

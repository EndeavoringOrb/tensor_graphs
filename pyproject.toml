[project]
name = "tensor_graphs"
version = "0.1.0"
description = "A graph-based tensor library for deep learning optimization and symbolic analysis."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aaron Belikoff", email = "aaronbelikoff@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "tqdm",
    "tokenizers",
    "huggingface-hub",
    "torch",
    "safetensors",
    "hf_xet",
    "transformers>=4.57.6",
    "torchvision>=0.23.0",
    "rich>=15.0.0",
    "ruff>=0.16.1",
    "flask>=3.1.3",
    "pydantic>=2.13.4",
    "pybind11>=3.0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tensor_graphs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=tensor_graphs"

[tool.ruff.lint]
ignore = ["E402", "F403", "E741"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }